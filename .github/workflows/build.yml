name: Build R3DNETWORK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: 34
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_NDK_VERSION: '25.2.9519653'
  CMAKE_VERSION: '3.22.1'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;${{ env.ANDROID_NDK_VERSION }}
            cmake;${{ env.CMAKE_VERSION }}
            platform-tools

      - name: Setup environment variables
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV
          echo "CMAKE_BIN=$ANDROID_SDK_ROOT/cmake/${{ env.CMAKE_VERSION }}/bin/cmake" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmake/${{ env.CMAKE_VERSION }}/bin" >> $GITHUB_PATH

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/.cxx
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache NDK build artifacts
        uses: actions/cache@v4
        with:
          path: app/src/main/obj
          key: ${{ runner.os }}-ndk-${{ hashFiles('app/src/main/jni/**/*.cpp', 'app/src/main/jni/**/*.h', 'app/src/main/jni/**/*.hpp') }}
          restore-keys: |
            ${{ runner.os }}-ndk-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Build ${{ env.BUILD_TYPE }} APK
        run: |
          if [ "${{ env.BUILD_TYPE }}" = "release" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon \
              -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android
          else
            ./gradlew assembleDebug --stacktrace --no-daemon
          fi

      - name: Generate build timestamp
        id: timestamp
        run: |
          echo "datetime=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Find and rename APK artifacts
        run: |
          BUILD_DIR="app/build/outputs/apk"
          TIMESTAMP="${{ steps.timestamp.outputs.datetime }}"
          SHA="${{ steps.timestamp.outputs.sha_short }}"
          
          if [ -f "$BUILD_DIR/release/app-release-unsigned.apk" ]; then
            cp "$BUILD_DIR/release/app-release-unsigned.apk" \
               "R3DNETWORK_ThrowIO_${SHA}_${TIMESTAMP}_release.apk"
          fi
          
          if [ -f "$BUILD_DIR/release/app-release.apk" ]; then
            cp "$BUILD_DIR/release/app-release.apk" \
               "R3DNETWORK_ThrowIO_${SHA}_${TIMESTAMP}_release-signed.apk"
          fi
          
          if [ -f "$BUILD_DIR/debug/app-debug.apk" ]; then
            cp "$BUILD_DIR/debug/app-debug.apk" \
               "R3DNETWORK_ThrowIO_${SHA}_${TIMESTAMP}_debug.apk"
          fi
          
          ls -la *.apk 2>/dev/null || echo "No APK files found in root"

      - name: List all build outputs
        run: |
          echo "=== Build outputs ==="
          find app/build/outputs -name "*.apk" -o -name "*.so" | sort
          echo ""
          echo "=== APK sizes ==="
          find app/build/outputs -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: R3DNETWORK-ThrowIO-${{ env.BUILD_TYPE }}-${{ steps.timestamp.outputs.sha_short }}
          path: |
            **/*.apk
            !**/*-unaligned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload native .so files (optional)
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-${{ steps.timestamp.outputs.sha_short }}
          path: |
            app/build/intermediates/stripped_native_libs/**/lib/arm64-v8a/*.so
            app/build/intermediates/stripped_native_libs/**/lib/armeabi-v7a/*.so
            app/src/main/libs/**/*.so
          if-no-files-found: warn
          retention-days: 14

      - name: Post build summary
        run: |
          echo "## ✅ Build Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | ${{ env.BUILD_TYPE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ steps.timestamp.outputs.sha_short }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | ${{ steps.timestamp.outputs.datetime }} |" >> $GITHUB_STEP_SUMMARY
          echo "| JDK | ${{ env.JAVA_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NDK | ${{ env.ANDROID_NDK_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APK Files:" >> $GITHUB_STEP_SUMMARY
          find app/build/outputs -name "*.apk" ! -name "*-unaligned.apk" -exec echo "- \`{}\`" \; >> $GITHUB_STEP_SUMMARY

  notify:
    name: Build Notification
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build status
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ Build SUCCESS"
          else
            echo "❌ Build FAILED"
            exit 1
          fi
